<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do TGT — N & M</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/todo.css" />
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      home
    </a>
    <span class="nav-title">to-do list tgt</span>
    <div class="nav-right">
      <span id="user-badge"></span>
      <button class="switch-btn" onclick="switchUser()">switch</button>
    </div>
  </nav>

  <!-- Abstract oil texture shapes -->
  <div class="todo-canvas" aria-hidden="true">
    <div class="oil-blob blob-a"></div>
    <div class="oil-blob blob-b"></div>
    <div class="oil-blob blob-c"></div>
  </div>

  <div class="page-content todo-content">

    <h2 class="section-heading todo-heading">things we'll do.</h2>
    <p class="todo-sub">add something. check it off when it's done.</p>

    <!-- Add item -->
    <div class="add-item-row">
      <input
        type="text"
        id="todo-input"
        class="todo-input-field"
        placeholder="add a new item..."
        maxlength="200"
      />
      <button class="todo-add-btn" id="todo-add-btn">+ add</button>
    </div>

    <!-- Active items -->
    <ul class="todo-list" id="todo-active" aria-label="Active items"></ul>

    <!-- Completed items -->
    <div class="completed-section" id="completed-section" style="display:none">
      <div class="completed-divider">
        <span>done</span>
      </div>
      <ul class="todo-list todo-done" id="todo-done" aria-label="Completed items"></ul>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/todo.js"></script>
</body>
</html>
