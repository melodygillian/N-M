<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Note — N & M</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/notes.css" />
</head>
<body>

  <!-- Sticky nav -->
  <nav class="top-nav">
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      home
    </a>
    <span class="nav-title">leave a note</span>
    <div class="nav-right">
      <span id="user-badge"></span>
      <button class="switch-btn" onclick="switchUser()">switch</button>
    </div>
  </nav>

  <!-- Ink brush decorations -->
  <div class="notes-deco" aria-hidden="true">
    <div class="brush brush-1"></div>
    <div class="brush brush-2"></div>
    <div class="brush brush-3"></div>
  </div>

  <div class="page-content notes-content">

    <!-- Compose box -->
    <section class="compose-section">
      <h2 class="section-heading notes-heading">say something.</h2>
      <div class="compose-card">
        <textarea
          id="note-input"
          placeholder="write your note here..."
          rows="4"
          maxlength="600"
        ></textarea>
        <div class="compose-footer">
          <span class="char-count" id="char-count">0 / 600</span>
          <button class="send-btn" id="send-btn">send ↗</button>
        </div>
      </div>
    </section>

    <!-- Notes feed -->
    <section class="feed-section">
      <div id="notes-feed" class="notes-feed">
        <p class="empty-state" id="empty-state">no notes yet. be the first. ✉</p>
      </div>
    </section>

  </div>

  <!-- Reply modal -->
  <div id="reply-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <p class="modal-context" id="modal-context"></p>
      <textarea id="reply-input" placeholder="your reply..." rows="3" maxlength="400"></textarea>
      <button class="send-btn modal-send" id="modal-send">reply ↗</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
